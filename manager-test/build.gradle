plugins {
    id 'java'
}

group = 'com.devives.jetty'
version = '0.1.0'

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

javadoc.options.encoding = "UTF-8"
javadoc.failOnError = false

dependencies {
    implementation 'com.devives:devive-commons-lang:0.2.0'
    implementation 'com.devives:devive-commons-manager:0.2.0'

    implementation(project(path: ':manager'))
}
