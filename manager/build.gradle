//    testCompileOnly "org.eclipse.jetty:jetty-server:$jettyVersion"
//    testCompileOnly "org.eclipse.jetty:jetty-start:$jettyVersion"
//    testCompileOnly "org.eclipse.jetty:jetty-security:$jettyVersion"
}

