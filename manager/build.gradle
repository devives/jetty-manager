plugins {
    id 'java'
}

group = 'com.devives.jetty'
base {
    archivesName = "devive-jetty-manager"
}
version = '0.1.0'

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

javadoc.options.encoding = "UTF-8"
javadoc.failOnError = false

ext {
    //jettyVersion = "9.4.58.v20250814"
    jettyVersion = "12.1.1"
}

dependencies {
    implementation 'com.devives:devive-commons-lang:0.3.1'
    implementation 'com.devives:devive-commons-manager:0.3.2'

// Can be uncommented for debugging.
