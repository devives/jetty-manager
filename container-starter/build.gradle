plugins {
    id 'java-library'
}

group = 'com.devives.jetty'
version = '0.1.0'
group = 'com.devives'
base {
    archivesName = "container-starter"
}
version = '0.1.0'

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

//java {
//    toolchain {
//        languageVersion = JavaLanguageVersion.of(21)
//        vendor = JvmVendorSpec.BELLSOFT
//    }
//    withJavadocJar()
//    withSourcesJar()
//}

ext {
    jettyVersion = "12.1.1"
}

dependencies {
    compileOnly "org.eclipse.jetty:jetty-start:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-util:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-server:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-security:$jettyVersion"
}

// Путь к каталогу назначения
def targetDir9 = file('../jetty9/usage/jetty-container-base/lib')
def targetDir12 = file('../jetty12/usage/jetty-container-base/lib')

// Задача копирования артефакта
tasks.register('copyJarToJetty9Lib', Copy) {
    dependsOn tasks.named('jar')   // выполняем после сборки jar
    from tasks.named('jar')        // берём результат jar
    into targetDir9                 // каталог назначения
    rename { String fileName ->
        fileName // можно переименовать, если нужно
    }
}
// Задача копирования артефакта
tasks.register('copyJarToJetty12Lib', Copy) {
    dependsOn tasks.named('jar')   // выполняем после сборки jar
    from tasks.named('jar')        // берём результат jar
    into targetDir12                 // каталог назначения
    rename { String fileName ->
        fileName // можно переименовать, если нужно
    }
}

// Если нужно, чтобы копирование выполнялось автоматически после jar:
tasks.named('jar') {
    finalizedBy tasks.named('copyJarToJetty9Lib')
    finalizedBy tasks.named('copyJarToJetty12Lib')
}
