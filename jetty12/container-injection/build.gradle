plugins {
    id 'java'
}

group = 'com.devives'
version = '0.1.0'
group = 'com.devives'
base {
    archivesName = "container-injection"
}
version = '0.1.0'

ext {
    jettyVersion = "12.1.1"
}

dependencies {
    compileOnly "org.eclipse.jetty:jetty-start:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-util:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-server:$jettyVersion"
    compileOnly "org.eclipse.jetty:jetty-security:$jettyVersion"
    implementation(project(":container-context"))
}

// Путь к каталогу назначения
def targetDir = file('../usage/container/lib')

// Задача копирования артефакта
tasks.register('copyJarToUsageLib', Copy) {
    dependsOn tasks.named('jar')   // выполняем после сборки jar
    from tasks.named('jar')        // берём результат jar
    into targetDir                 // каталог назначения
    rename { String fileName ->
        fileName // можно переименовать, если нужно
    }
}

// Если нужно, чтобы копирование выполнялось автоматически после jar:
tasks.named('jar') {
    finalizedBy tasks.named('copyJarToUsageLib')
}
